<!-- MOD-004: JAVASCRIPT [INICIO] -->
<script>
// Planning Module (Encapsulado)
window.PlanningModule = (function () {

  const state = {
    currentWeekOffset: 0,
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear()
  };

  function getContainer() {
    return document.getElementById('planning-container');
  }

  function switchTab(name) {
    const container = getContainer();
    if (!container) return;

    container.querySelectorAll('.subtab-content').forEach(el => el.classList.remove('active'));
    container.querySelectorAll('.subtab-btn').forEach(el => el.classList.remove('active'));

    const tab = document.getElementById('subtab-' + name);
    if (tab) tab.classList.add('active');

    const btn = [...container.querySelectorAll('.subtab-btn')]
      .find(b => b.textContent.toLowerCase().includes(name.replace('horario', 'horario')));
    if (btn) btn.classList.add('active');

    console.log('[Planning] Sub-tab activo:', name);

    if (window.pbeFlags) {
      if (window.pbeFlags.cursos) {
        window.pbeFlags.cursos = false;
        if (name === 'horarioclase' && typeof window.hcRecargarCursos === 'function') {
          window.hcRecargarCursos();
        }
        if (name === 'horariosem' && typeof window.hsRecargarCursos === 'function') {
          window.hsRecargarCursos();
        }
      }
      if (window.pbeFlags.horarioclase) {
        window.pbeFlags.horarioclase = false;
        if (name === 'horarioclase' && typeof window.hcRecargarHorario === 'function') {
          window.hcRecargarHorario();
        }
        if (name === 'horariosem' && typeof window.hsRefrescar === 'function') {
          window.hsRefrescar();
        }
      }
      if (name === 'horariosem' && window.pbeFlags.horariosem) {
        window.pbeFlags.horariosem = false;
        if (typeof window.hsRefrescar === 'function') window.hsRefrescar();
      }
      if (name === 'calendario' && window.pbeFlags.calendario) {
        window.pbeFlags.calendario = false;
        if (window.CalendarioModule && typeof window.CalendarioModule.reload === 'function') {
          window.CalendarioModule.reload();
        }
      }
    }
  }

  function obtenerDiasSemanaActual() {
    const hoy = new Date();
    const lunes = new Date(hoy);
    lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
    return Array.from({ length: 7 }, (_, i) => new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + i));
  }

  function horaAMinutos(h) {
    if (!h || !h.includes(':')) return 0;
    const [hh, mm] = h.split(':').map(Number);
    return (hh * 60) + mm;
  }

  function minutosAHora(m) {
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }

  function calcularPromedioPonderado(items = []) {
    let total = 0, peso = 0;
    items.forEach(i => {
      const n = parseFloat(i.nota), p = parseFloat(i.peso);
      if (!isNaN(n) && !isNaN(p)) {
        total += n * p;
        peso += p;
      }
    });
    return peso ? (total / peso).toFixed(2) : 0;
  }

  console.log('%c📅 Planning V01.23 cargado', 'color:#667eea;font-weight:bold;');

  return {
    switchTab,
    state,
    obtenerDiasSemanaActual,
    horaAMinutos,
    minutosAHora,
    calcularPromedioPonderado
  };

})();
</script>
