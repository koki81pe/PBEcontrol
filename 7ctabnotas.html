<!-- MOD-009: JAVASCRIPT — MÓDULO COMPLETO [INICIO] -->
<script>

// MOD-009-001: ENCAPSULAMIENTO, VARIABLES E INIT [INICIO]
(function PBE_NOTAS_MODULE() {
  'use strict';

  if (window.NotasModule && window.NotasModule._loaded) return;

  let _data = [];

  const NotasModule = {};

  NotasModule._loaded = true;

  NotasModule.init = function() {
    if (!window.currentUser || !window.currentUser.codeAlum) {
      _mostrarVacio('No se pudo identificar al usuario.');
      return;
    }
    _cargar();
  };
// MOD-009-001: FIN

// MOD-009-002: CARGA DE DATOS DESDE BACKEND [INICIO]
  function _cargar() {
    _mostrarLoading();
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success && Array.isArray(r.data)) {
          _data = r.data;
          _renderTodo();
        } else {
          _mostrarVacio('No hay deberes con peso registrados.');
        }
      })
      .withFailureHandler(function() {
        _mostrarVacio('Error al cargar los datos.');
      })
      .studentObtenerNotasGrid({ codeAlum: currentUser.codeAlum });
  }

  NotasModule.recargar = function() {
    _cargar();
  };
// MOD-009-002: FIN

// MOD-009-003: RENDER — LOOP POR CURSOS [INICIO]
  function _renderTodo() {
    const cont = document.getElementById('nt-grids');
    if (!cont) return;

    if (!_data.length) {
      _mostrarVacio('No hay deberes con peso registrados.');
      return;
    }

    cont.innerHTML = _data.map(function(curso) {
      return _renderCurso(curso);
    }).join('');
  }
// MOD-009-003: FIN

// MOD-009-004: RENDER — CONSTRUIR TABLA DE UN CURSO [INICIO]
  function _renderCurso(curso) {
    const deberes = curso.deberes || [];
    const color   = curso.color || '#667eea';

    const tituloHtml = `
      <div class="nt-curso-bloque">
        <div class="nt-curso-titulo">
          <div style="width:6px;height:28px;background:${color};border-radius:3px;flex-shrink:0"></div>
          <h3>${curso.completo || curso.curso}</h3>
          <span class="nt-curso-codigo">${curso.curso}</span>
        </div>`;

    if (!deberes.length) {
      return tituloHtml + `
        <p class="nt-sin-deberes">Sin deberes con peso registrados.</p>
      </div>`;
    }

    const totales  = _calcularTotales(deberes);
    const pesoTotal = totales.pesoTotal;
    const ntTotal   = totales.ntTotal;

    // Fila Fecha
    let filaFecha  = '<tr class="nt-fila-fecha"><td class="nt-label">Fecha</td>';
    // Fila Semana
    let filaSemana = '<tr class="nt-fila-semana"><td class="nt-label">Semana</td>';
    // Fila Evaluación
    let filaEval   = '<tr class="nt-fila-eval"><td class="nt-label">Evaluación</td>';
    // Fila Peso
    let filaPeso   = '<tr class="nt-fila-peso"><td class="nt-label">Peso</td>';
    // Fila Nota
    let filaNota   = '<tr class="nt-fila-nota"><td class="nt-label">Nota</td>';
    // Fila Nota Final
    let filaFinal  = '<tr class="nt-fila-notafinal"><td class="nt-label">Nota Final</td>';

    deberes.forEach(function(d) {
      const nf = _calcularNotaFinal(d.nota, d.peso);
      const nfTxt = nf !== null ? nf.toFixed(2) : '—';
      const notaTxt = d.nota !== '' && d.nota !== null ? d.nota : '—';
      const editData = encodeURIComponent(JSON.stringify({
        tipo:      d.tipo,
        rowNumber: d.rowNumber,
        curso:     curso.curso,
        nombre:    d.nombre,
        fecha:     d.fecha,
        nota:      d.nota,
        peso:      d.peso,
        fechaInicio: d.fechaInicio || '',
        fechaFin:    d.fechaFin   || '',
        fechaEval:   d.fechaEval  || '',
        cantPag:     d.cantPag    || '',
        pagActual:   d.pagActual  || ''
      }));

      filaFecha  += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">${d.fecha || '—'}</td>`;
      filaSemana += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">Sem. ${d.semana || '—'}</td>`;
      filaEval   += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">${d.nombre}</td>`;
      filaPeso   += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">${d.peso}%</td>`;
      filaNota   += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">${notaTxt}</td>`;
      filaFinal  += `<td class="nt-celda-deber" onclick="window.NotasModule.abrirEditar('${editData}')">${nfTxt}</td>`;
    });

    // Columna Total
    filaFecha  += `<td class="nt-col-total">Total</td></tr>`;
    filaSemana += `<td class="nt-col-total">—</td></tr>`;
    filaEval   += `<td class="nt-col-total">—</td></tr>`;
    filaPeso   += `<td class="nt-col-total">${pesoTotal}%</td></tr>`;
    filaNota   += `<td class="nt-col-total">—</td></tr>`;
    filaFinal  += `<td class="nt-col-total">${ntTotal.toFixed(2)}</td></tr>`;

    return tituloHtml + `
        <div class="nt-tabla-wrapper">
          <table class="nt-tabla">
            <tbody>
              ${filaFecha}
              ${filaSemana}
              ${filaEval}
              ${filaPeso}
              ${filaNota}
              ${filaFinal}
            </tbody>
          </table>
        </div>
      </div>`;
  }
// MOD-009-004: FIN

// MOD-009-005: CÁLCULO NOTA FINAL Y TOTALES [INICIO]
  function _calcularNotaFinal(nota, peso) {
    const n = parseFloat(nota);
    const p = parseFloat(peso);
    if (isNaN(n) || isNaN(p) || p === 0) return null;
    return n * (p / 100);
  }

  function _calcularTotales(deberes) {
    let pesoTotal = 0;
    let ntTotal   = 0;
    deberes.forEach(function(d) {
      const p  = parseFloat(d.peso)  || 0;
      const nf = _calcularNotaFinal(d.nota, d.peso);
      pesoTotal += p;
      if (nf !== null) ntTotal += nf;
    });
    return { pesoTotal: pesoTotal, ntTotal: ntTotal };
  }
// MOD-009-005: FIN

// MOD-009-006: ABRIR MODAL AGREGAR NUEVO DEBER [INICIO]
  NotasModule.abrirAgregar = function() {
    if (!window.ModalDeberModule) {
      console.error('[NotasModule] ModalDeberModule no disponible');
      return;
    }
    window.ModalDeberModule.abrir({ tipo: 'eval', origen: 'notas' });
  };
// MOD-009-006: FIN

// MOD-009-007: ABRIR MODAL EDITAR DEBER EXISTENTE [INICIO]
  NotasModule.abrirEditar = function(encodedData) {
    if (!window.ModalDeberModule) {
      console.error('[NotasModule] ModalDeberModule no disponible');
      return;
    }
    try {
      const d = JSON.parse(decodeURIComponent(encodedData));
      window.ModalDeberModule.abrir({
        tipo:        d.tipo,
        origen:      'notas',
        modoEdicion: true,
        rowNumber:   d.rowNumber,
        curso:       d.curso,
        nombre:      d.nombre,
        fecha:       d.fecha,
        nota:        d.nota,
        peso:        d.peso,
        fechaInicio: d.fechaInicio,
        fechaFin:    d.fechaFin,
        fechaEval:   d.fechaEval,
        cantPag:     d.cantPag,
        pagActual:   d.pagActual
      });
    } catch(e) {
      console.error('[NotasModule] Error al parsear datos de edición:', e);
    }
  };
// MOD-009-007: FIN

// MOD-009-008: RECARGA TRAS GUARDAR (NOTAS FLAG) [INICIO]
  NotasModule.onGuardado = function() {
    _cargar();
  };

  window.addEventListener('pbeNotasFlag', function() {
    _cargar();
  });
// MOD-009-008: FIN

// MOD-009-009: ESTADOS LOADING Y VACÍO [INICIO]
  function _mostrarLoading() {
    const cont = document.getElementById('nt-grids');
    if (!cont) return;
    cont.innerHTML = `
      <div class="nt-loading">
        <div class="nt-spinner"></div>
        <p>Cargando notas...</p>
      </div>`;
  }

  function _mostrarVacio(msg) {
    const cont = document.getElementById('nt-grids');
    if (!cont) return;
    cont.innerHTML = `<div class="nt-empty">📊 ${msg || 'Sin datos'}</div>`;
  }
// MOD-009-009: FIN

// MOD-009-010: HELPER — PARSEAR FECHA DD/MM/AAAA [INICIO]
  function _parsearFecha(str) {
    if (!str) return null;
    const p = str.split('/');
    if (p.length !== 3) return null;
    return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  }

  NotasModule._parsearFecha = _parsearFecha;
// MOD-009-010: FIN

// MOD-009-011: EXPOSICIÓN GLOBAL E INIT [INICIO]
  window.NotasModule = NotasModule;
  NotasModule.init();

  console.log('%c📊 NotasModule V01.22 cargado', 'color:#667eea;font-weight:bold;font-size:11px');

})();
// MOD-009-011: FIN

</script>
<!-- MOD-009: FIN -->

<!-- MOD-099: NOTAS [INICIO] -->
<!--
DESCRIPCIÓN:
Vista de notas por curso en formato grid/tabla.
Cada curso muestra una tabla con columnas por deber (con peso) y columna Total.

FILAS DEL GRID:
- Fecha, Semana, Evaluación, Peso, Nota, Nota Final

LÓGICA:
- Solo deberes con peso son mostrados
- Nota Final = Nota × (Peso / 100)
- Total = Σ Notas Finales
- Semana calculada en backend desde FechaInicio de hoja Fechas

CRUD:
- Botón "Agregar deber" → ModalDeberModule.abrir({ origen: 'notas' })
- Clic en celda → ModalDeberModule.abrir({ modoEdicion: true, origen: 'notas' })
- Tras guardar → NotasModule.onGuardado() recarga el grid

DEPENDENCIAS:
- currentUser.codeAlum              → requerido
- studentObtenerNotasGrid()         → 1code.gs wrapper
- window.ModalDeberModule           → 2modaldeberes.html
- window.pbeFlags                   → 3panelstudent.html

PENDIENTE (otros archivos):
- 1student.gs  → nueva función obtenerNotasGrid()
- 1code.gs     → nuevo wrapper studentObtenerNotasGrid()
- 2modaldeberes.html → agregar modoEdicion + origen 'notas'
- 3panelstudent.html → agregar pbeFlags.notas
-->
