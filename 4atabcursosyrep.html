<!-- MOD-004: JAVASCRIPT [INICIO] -->
<script>
(function () {
  'use strict';

  const loaded = {
    cursos: false,
    repasos: false
  };

  // Switch de SubTabs
  function switchSubTab(name) {

    document.querySelectorAll('.subtab-content')
      .forEach(el => el.classList.remove('active'));

    document.querySelectorAll('.subtab-btn')
      .forEach(el => el.classList.remove('active'));

    document.getElementById('subtab-' + name).classList.add('active');
    document.getElementById('btn-subtab-' + name).classList.add('active');

    // Verificar pbeFlags.cursos al navegar a Repasos
    if (window.pbeFlags && window.pbeFlags.cursos && name === 'repasos') {
      window.pbeFlags.cursos = false;
      if (window.RepasosModule && typeof window.RepasosModule.recargarCursos === 'function') {
        console.log('[4atabcursosyrep] 🔄 Recargando cursos en Repasos por pbeFlags.cursos');
        window.RepasosModule.recargarCursos();
      }
    }

    if (!loaded[name]) {
      loaded[name] = true;

      console.log('🟢 Inicializando subtab:', name);

      if (name === 'cursos' && window.CursosModule) {
        window.CursosModule.init();
      } else if (name === 'repasos' && window.RepasosModule) {
        window.RepasosModule.init();
      }

      document.dispatchEvent(
        new CustomEvent('pbe:subtab-activated', {
          detail: name
        })
      );
    }
  }

  // Auto-activar Cursos al cargar
  function initDefaultSubTab() {
    console.log('📦 4atabcursosyrep V01.25: Activando Cursos por defecto');

    setTimeout(function() {
      switchSubTab('cursos');
    }, 100);
  }

  window.switchSubTab = switchSubTab;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDefaultSubTab);
  } else {
    initDefaultSubTab();
  }

  console.log('%c📦 4atabcursosyrep V01.25 cargado',
    'font-weight:bold;color:#667eea');
})();
</script>
<!-- MOD-004: FIN -->
