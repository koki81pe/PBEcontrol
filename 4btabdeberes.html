<!-- MOD-004: JAVASCRIPT V2 [INICIO] -->
<script>

// MOD-004-001: VARIABLES GLOBALES Y CONTROL LAZY-INIT [INICIO]
// Control de Lazy-Init para Módulos
var deberesSubtabsLoaded = {
  todos: false,
  eval: false,
  tareas: false,
  lecturas: false
};
// MOD-004-001: FIN

// MOD-004-002: FUNCIÓN SWITCH SUBTABDEBERES [INICIO]
// Navegación entre Sub-tabs Deberes
function switchSubTabDeberes(subTabName) {
  console.log('[4btabdeberes] 🔄 switchSubTabDeberes llamada con:', subTabName);

  document.querySelectorAll('.subtab-content').forEach(function(content) {
    content.classList.remove('active');
  });

  document.querySelectorAll('.subtab-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });

  const selectedTab = document.getElementById('subtab-' + subTabName);
  if (selectedTab) {
    selectedTab.classList.add('active');
    console.log('[4btabdeberes] ✅ Sub-tab activado:', subTabName);
  } else {
    console.error('[4btabdeberes] ❌ No se encontró elemento: subtab-' + subTabName);
  }

  const selectedBtn = document.getElementById('btn-subtab-' + subTabName);
  if (selectedBtn) {
    selectedBtn.classList.add('active');
  } else {
    console.error('[4btabdeberes] ❌ No se encontró botón: btn-subtab-' + subTabName);
  }

  console.log('Sub-tab Deberes cambiado a:', subTabName);

  if (window.pbeFlags) {

    if (window.pbeFlags.cursos) {
      window.pbeFlags.cursos = false;
      if (window.EvalModule    && typeof window.EvalModule.recargarCursos    === 'function') window.EvalModule.recargarCursos();
      if (window.TareasModule  && typeof window.TareasModule.recargarCursos  === 'function') window.TareasModule.recargarCursos();
      if (window.LecturasModule && typeof window.LecturasModule.recargarCursos === 'function') window.LecturasModule.recargarCursos();
    }

    if (window.pbeFlags.deberes) {
      window.pbeFlags.deberes = false;
      if (subTabName === 'eval'     && window.EvalModule    && typeof window.EvalModule.recargar    === 'function') window.EvalModule.recargar();
      if (subTabName === 'tareas'   && window.TareasModule  && typeof window.TareasModule.recargar  === 'function') window.TareasModule.recargar();
      if (subTabName === 'lecturas' && window.LecturasModule && typeof window.LecturasModule.recargar === 'function') window.LecturasModule.recargar();
      if (subTabName === 'todos'    && window.TodosModule   && typeof window.TodosModule.cargarDeberes === 'function') window.TodosModule.cargarDeberes();
    }

  }

  if (!deberesSubtabsLoaded[subTabName]) {
    deberesSubtabsLoaded[subTabName] = true;

    if (subTabName === 'lecturas' && window.LecturasModule) {
      console.log('[4btabdeberes] 📖 Inicializando LecturasModule...');
      window.LecturasModule.inicializar();
    } else if (subTabName === 'tareas' && window.TareasModule) {
      console.log('[4btabdeberes] ✏️ Inicializando TareasModule...');
      window.TareasModule.init();
    } else if (subTabName === 'eval' && window.EvalModule) {
      console.log('[4btabdeberes] 📝 Inicializando EvalModule...');
      window.EvalModule.init();
    } else if (subTabName === 'todos' && window.TodosModule) {
      console.log('[4btabdeberes] 📋 Inicializando TodosModule...');
      window.TodosModule.inicializar();
    } else {
      console.warn('[4btabdeberes] ⚠️ Módulo no encontrado para:', subTabName);
    }
  } else {
    console.log('[4btabdeberes] ℹ️ Módulo ya inicializado:', subTabName);
  }
}
// MOD-004-002: FIN

// MOD-004-003: FUNCIÓN UPDATE DEBERES BADGE [INICIO]
// Actualizar Badge de Contador
function updateDeberesBadge(tipo, count) {
  const badge = document.querySelector('.tab-badge[data-tab="' + tipo + '"]');
  if (!badge) return;

  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}
// MOD-004-003: FIN

// MOD-004-004: FUNCIÓN FILTRAR POR FECHA [INICIO]
// Filtrar Deberes por Rango de Fechas
function filtrarPorFecha(deberes, desde, hasta) {
  if (!Array.isArray(deberes)) return [];
  if (!desde || !hasta) return deberes;

  const fechaDesde = parseFechaDD_MM_AAAA(desde);
  const fechaHasta = parseFechaDD_MM_AAAA(hasta);

  if (!fechaDesde || !fechaHasta) return deberes;

  return deberes.filter(function(deber) {
    if (!deber.fecha) return false;
    const fechaDeber = parseFechaDD_MM_AAAA(deber.fecha);
    if (!fechaDeber) return false;
    return fechaDeber >= fechaDesde && fechaDeber <= fechaHasta;
  });
}
// MOD-004-004: FIN

// MOD-004-005: HELPER PARSE FECHA DDMMAAAA [INICIO]
// Parsear Fecha DD/MM/AAAA a Date
function parseFechaDD_MM_AAAA(fecha) {
  if (!fecha) return null;

  try {
    const partes = fecha.split('/');
    if (partes.length !== 3) return null;
    
    const dia = parseInt(partes[0]);
    const mes = parseInt(partes[1]) - 1;
    const anio = parseInt(partes[2]);
    
    return new Date(anio, mes, dia);
  } catch(error) {
    return null;
  }
}
// MOD-004-005: FIN

// MOD-004-006: FUNCIÓN ORDENAR POR FECHA [INICIO]
// Ordenar por Fecha
function ordenarPorFecha(deberes) {
  return deberes.sort(function(a, b) {
    if (!a.fecha) return 1;
    if (!b.fecha) return -1;

    const fechaA = parseFechaDD_MM_AAAA(a.fecha);
    const fechaB = parseFechaDD_MM_AAAA(b.fecha);

    if (!fechaA) return 1;
    if (!fechaB) return -1;

    return fechaA - fechaB;
  });
}
// MOD-004-006: FIN

// MOD-004-007: AUTO-ACTIVACIÓN Y LOGS FINALES [INICIO]
// Auto-activar Sub-tab por defecto
setTimeout(function() {
  console.log('[4btabdeberes] 🚀 Auto-activando sub-tab por defecto: todos');
  switchSubTabDeberes('todos');
}, 100);

console.log('%c📝 Tab Deberes Cargado [V01.20]', 
            'font-size: 12px; font-weight: bold; color: #667eea;');
console.log('Sub-tabs disponibles: Todos, Evaluaciones, Tareas, Lecturas');
console.log('Funciones auxiliares: updateDeberesBadge, filtrarPorFecha, ordenarPorFecha');
console.log('currentUser disponible:', typeof currentUser !== 'undefined');
console.log('Lazy-init habilitado para todos los sub-tabs');
// MOD-004-007: FIN

</script>
