<!-- MOD-009: JAVASCRIPT — MODALDEBEREMODULE [INICIO] -->
<script>

// MOD-009-001: ENCAPSULAMIENTO IIFE Y VARIABLES [INICIO]
(function PBE_MODAL_DEBERES() {
  'use strict';

  if (window.ModalDeberModule && window.ModalDeberModule._loaded) {
    console.log('📋 ModalDeberModule ya cargado, ignorando');
    return;
  }

  let _tipoActivo = 'eval';
  let _fechaActual = '';
  let _origen      = '';
  let _cursosCache = [];
  let _cursosListos = false;
// MOD-009-001: FIN

// MOD-009-002: ABRIR MODAL [INICIO]
  function abrir(params) {
    params = params || {};
    _tipoActivo  = params.tipo   || 'eval';
    _fechaActual = params.fecha  || '';
    _origen      = params.origen || '';

    _limpiarTodo();
    _actualizarTitulo();
    cambiarTipo(_tipoActivo);
    _preFecha();

    if (!_cursosListos) {
      _cargarCursos();
    }

    document.getElementById('mdOverlay').classList.add('active');
    console.log('[ModalDeberModule] Abierto — tipo:', _tipoActivo, '| fecha:', _fechaActual, '| origen:', _origen);
  }
// MOD-009-002: FIN

// MOD-009-003: CERRAR MODAL Y LIMPIAR ESTADO [INICIO]
  function cerrar() {
    document.getElementById('mdOverlay').classList.remove('active');
    _ocultarAlerta();
  }

  function cerrarSiFondo(event) {
    if (event.target.id === 'mdOverlay') cerrar();
  }

  function _limpiarTodo() {
    _limpiarEval();
    _limpiarTarea();
    _limpiarLect();
    _resetBotones();
    _ocultarAlerta();
  }

  function _limpiarEval() {
    _val('md-eval-curso',  '');
    _val('md-eval-nombre', '');
    _val('md-eval-fecha',  '');
    _val('md-eval-nota',   '');
    _val('md-eval-peso',   '');
  }

  function _limpiarTarea() {
    _val('md-tarea-curso',        '');
    _val('md-tarea-nombre',       '');
    _val('md-tarea-fechaentrega', '');
    _val('md-tarea-fecharealiz',  '');
    _val('md-tarea-nota',         '');
    _val('md-tarea-peso',         '');
  }

  function _limpiarLect() {
    _val('md-lect-curso',       '');
    _val('md-lect-titulo',      '');
    _val('md-lect-cantpag',     '');
    _val('md-lect-pagactual',   '0');
    _val('md-lect-fechainicio', '');
    _val('md-lect-fechafin',    '');
    _val('md-lect-fechaeval',   '');
    _val('md-lect-nota',        '');
    _val('md-lect-peso',        '');
  }

  function _resetBotones() {
    ['mdFormEval', 'mdFormTarea', 'mdFormLect'].forEach(function(formId) {
      const form = document.getElementById(formId);
      if (!form) return;
      const btn = form.querySelector('.md-btn-primario');
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    });
  }
// MOD-009-003: FIN

// MOD-009-004: CAMBIAR TIPO ACTIVO [INICIO]
  function cambiarTipo(tipo) {
    _tipoActivo = tipo;

    ['eval', 'tarea', 'lect'].forEach(function(t) {
      const btn  = document.getElementById('mdBtn' + _capitalizar(t));
      const form = document.getElementById('mdForm' + _capitalizar(t));
      if (btn)  btn.classList.toggle('active',  t === tipo);
      if (form) form.classList.toggle('active', t === tipo);
    });

    _actualizarTitulo();
    _preFecha();
    _ocultarAlerta();
    console.log('[ModalDeberModule] Tipo activo:', _tipoActivo);
  }

  function _actualizarTitulo() {
    const titulos = { eval: 'Nueva Evaluación', tarea: 'Nueva Tarea', lect: 'Nueva Lectura' };
    const el = document.getElementById('mdTitulo');
    if (el) el.textContent = titulos[_tipoActivo] || 'Nuevo Deber';
  }

  function _preFecha() {
    if (!_fechaActual) return;
    if (_tipoActivo === 'eval') _val('md-eval-fecha', _fechaActual);
    if (_tipoActivo === 'tarea') _val('md-tarea-fechaentrega', _fechaActual);
    if (_tipoActivo === 'lect') _val('md-lect-fechaeval', _fechaActual);
  }
// MOD-009-004: FIN

// MOD-009-005: CARGAR CURSOS DESDE GAS [INICIO]
  function _cargarCursos() {
    if (typeof currentUser === 'undefined' || !currentUser.codeAlum) return;

    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success && Array.isArray(response.data)) {
          _cursosCache  = response.data;
          _cursosListos = true;
          _poblarSelects();
        }
      })
      .withFailureHandler(function(e) {
        console.error('[ModalDeberModule] Error al cargar cursos:', e);
      })
      .studentObtenerCursos({ codeAlum: currentUser.codeAlum });
  }
// MOD-009-005: FIN

// MOD-009-006: POBLAR SELECTS DE CURSOS [INICIO]
  function _poblarSelects() {
    ['md-eval-curso', 'md-tarea-curso', 'md-lect-curso'].forEach(function(id) {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = '<option value="">Seleccionar curso...</option>';
      _cursosCache.forEach(function(c) {
        const opt = document.createElement('option');
        opt.value       = c.Curso;
        opt.textContent = c.Curso;
        sel.appendChild(opt);
      });
    });
  }
// MOD-009-006: FIN

// MOD-009-007: VALIDACIÓN DE CAMPOS [INICIO]
  function _validarFecha(f) {
    return /^\d{2}\/\d{2}\/\d{4}$/.test(f);
  }

  function _get(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function _mostrarAlerta(tipo, msg) {
    const el = document.getElementById('mdAlerta');
    if (!el) return;
    el.className  = 'md-alerta active ' + tipo;
    el.textContent = msg;
  }

  function _ocultarAlerta() {
    const el = document.getElementById('mdAlerta');
    if (el) { el.className = 'md-alerta'; el.textContent = ''; }
  }
// MOD-009-007: FIN

// MOD-009-008: SUBMIT EVALUACIÓN [INICIO]
  function submitEval() {
    const curso   = _get('md-eval-curso');
    const nombre  = _get('md-eval-nombre');
    const fecha   = _get('md-eval-fecha');
    const nota    = _get('md-eval-nota');
    const peso    = _get('md-eval-peso');

    if (!curso || !nombre || !fecha) {
      _mostrarAlerta('error', 'Completa los campos obligatorios: Curso, Nombre y Fecha.');
      return;
    }
    if (!_validarFecha(fecha)) {
      _mostrarAlerta('error', 'Formato de fecha inválido. Usa DD/MM/AAAA.');
      return;
    }

    _bloquearBtn('mdFormEval');

    google.script.run
      .withSuccessHandler(function(response) {
        if (!response || response.success !== true) {
          _mostrarAlerta('error', (response && response.error) || 'No se pudo guardar la evaluación.');
          _desbloquearBtn('mdFormEval');
          return;
        }
        _onGuardadoExitoso('Evaluación guardada exitosamente.');
      })
      .withFailureHandler(function(e) {
        console.error('[ModalDeberModule] Error eval:', e);
        _mostrarAlerta('error', 'Error de conexión. Intenta nuevamente.');
        _desbloquearBtn('mdFormEval');
      })
      .studentAgregarEvaluacion({
        codeAlum: currentUser.codeAlum,
        curso:    curso,
        nomEval:  nombre,
        fechaEval: fecha,
        nota:     nota,
        peso:     peso,
        sem:      ''
      });
  }
// MOD-009-008: FIN

// MOD-009-009: SUBMIT TAREA [INICIO]
  function submitTarea() {
    const curso        = _get('md-tarea-curso');
    const nombre       = _get('md-tarea-nombre');
    const fechaEntrega = _get('md-tarea-fechaentrega');
    const fechaRealiz  = _get('md-tarea-fecharealiz');
    const nota         = _get('md-tarea-nota');
    const peso         = _get('md-tarea-peso');

    if (!curso || !nombre || !fechaEntrega) {
      _mostrarAlerta('error', 'Completa los campos obligatorios: Curso, Nombre y Fecha de Entrega.');
      return;
    }
    if (!_validarFecha(fechaEntrega)) {
      _mostrarAlerta('error', 'Formato de fecha de entrega inválido. Usa DD/MM/AAAA.');
      return;
    }
    if (fechaRealiz && !_validarFecha(fechaRealiz)) {
      _mostrarAlerta('error', 'Formato de fecha de realización inválido. Usa DD/MM/AAAA.');
      return;
    }

    _bloquearBtn('mdFormTarea');

    google.script.run
      .withSuccessHandler(function(response) {
        if (!response || response.success !== true) {
          _mostrarAlerta('error', (response && response.error) || 'No se pudo guardar la tarea.');
          _desbloquearBtn('mdFormTarea');
          return;
        }
        _onGuardadoExitoso('Tarea guardada exitosamente.');
      })
      .withFailureHandler(function(e) {
        console.error('[ModalDeberModule] Error tarea:', e);
        _mostrarAlerta('error', 'Error de conexión. Intenta nuevamente.');
        _desbloquearBtn('mdFormTarea');
      })
      .studentAgregarTarea({
        codeAlum:     currentUser.codeAlum,
        curso:        curso,
        tarea:        nombre,
        fechaEntrega: fechaEntrega,
        fechaAccion:  fechaRealiz,
        nota:         nota,
        peso:         peso,
        sem:          ''
      });
  }
// MOD-009-009: FIN

// MOD-009-010: SUBMIT LECTURA [INICIO]
  function submitLect() {
    const curso       = _get('md-lect-curso');
    const titulo      = _get('md-lect-titulo');
    const cantPag     = _get('md-lect-cantpag');
    const pagActual   = _get('md-lect-pagactual') || '0';
    const fechaInicio = _get('md-lect-fechainicio');
    const fechaFin    = _get('md-lect-fechafin');
    const fechaEval   = _get('md-lect-fechaeval');
    const nota        = _get('md-lect-nota');
    const peso        = _get('md-lect-peso');

    if (!curso || !titulo || !cantPag || !fechaInicio || !fechaFin) {
      _mostrarAlerta('error', 'Completa los campos obligatorios: Curso, Título, Páginas, Fecha Inicio y Fecha Fin.');
      return;
    }
    if (!_validarFecha(fechaInicio)) {
      _mostrarAlerta('error', 'Formato de fecha de inicio inválido. Usa DD/MM/AAAA.');
      return;
    }
    if (!_validarFecha(fechaFin)) {
      _mostrarAlerta('error', 'Formato de fecha de fin inválido. Usa DD/MM/AAAA.');
      return;
    }
    if (fechaEval && !_validarFecha(fechaEval)) {
      _mostrarAlerta('error', 'Formato de fecha de evaluación inválido. Usa DD/MM/AAAA.');
      return;
    }
    if (parseInt(cantPag) <= 0) {
      _mostrarAlerta('error', 'El total de páginas debe ser mayor a 0.');
      return;
    }

    _bloquearBtn('mdFormLect');

    google.script.run
      .withSuccessHandler(function(response) {
        if (!response || response.success !== true) {
          _mostrarAlerta('error', (response && response.error) || 'No se pudo guardar la lectura.');
          _desbloquearBtn('mdFormLect');
          return;
        }
        _onGuardadoExitoso('Lectura guardada exitosamente.');
      })
      .withFailureHandler(function(e) {
        console.error('[ModalDeberModule] Error lectura:', e);
        _mostrarAlerta('error', 'Error de conexión. Intenta nuevamente.');
        _desbloquearBtn('mdFormLect');
      })
      .studentAgregarLectura({
        codeAlum:    currentUser.codeAlum,
        curso:       curso,
        lectura:     titulo,
        cantPag:     cantPag,
        pagActual:   pagActual,
        fechaInicio: fechaInicio,
        fechaFin:    fechaFin,
        fechaEval:   fechaEval,
        nota:        nota,
        peso:        peso,
        sem:         ''
      });
  }
// MOD-009-010: FIN

// MOD-009-011: RETORNO AL ORIGEN [INICIO]
  function _onGuardadoExitoso(mensaje) {
    cerrar();

    if (_origen === 'horariosem') {
      if (window.PlanningModule && typeof window.PlanningModule.switchTab === 'function') {
        window.PlanningModule.switchTab('horariosem');
      }
      setTimeout(function() {
        if (typeof window.renderizarDeberes === 'function') {
          window.renderizarDeberes();
        } else if (window.HorarioSemanalModule && typeof window.HorarioSemanalModule.renderizarDeberes === 'function') {
          window.HorarioSemanalModule.renderizarDeberes();
        }
      }, 300);
    }

    if (_origen === 'calendario') {
      if (window.PlanningModule && typeof window.PlanningModule.switchTab === 'function') {
        window.PlanningModule.switchTab('calendario');
      }
      setTimeout(function() {
        if (window.CalendarioModule && typeof window.CalendarioModule.init === 'function') {
          window.CalendarioModule.init();
        }
      }, 300);
    }

    if (typeof window.showAlert === 'function') {
      window.showAlert('success', mensaje);
    }

    console.log('[ModalDeberModule] Guardado exitoso. Retornando a origen:', _origen);
  }
// MOD-009-011: FIN

// MOD-009-012: HELPERS, EXPOSICIÓN GLOBAL Y ARRANQUE [INICIO]
  function _capitalizar(str) {
    if (str === 'lect') return 'Lect';
    if (str === 'eval') return 'Eval';
    if (str === 'tarea') return 'Tarea';
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function _val(id, valor) {
    const el = document.getElementById(id);
    if (el) el.value = valor;
  }

  function _bloquearBtn(formId) {
    const form = document.getElementById(formId);
    if (!form) return;
    const btn = form.querySelector('.md-btn-primario');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  }

  function _desbloquearBtn(formId) {
    const form = document.getElementById(formId);
    if (!form) return;
    const btn = form.querySelector('.md-btn-primario');
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }
  }

  window.ModalDeberModule = {
    _loaded:      true,
    abrir:        abrir,
    cerrar:       cerrar,
    cerrarSiFondo: cerrarSiFondo,
    cambiarTipo:  cambiarTipo,
    submitEval:   submitEval,
    submitTarea:  submitTarea,
    submitLect:   submitLect
  };

  console.log('%c📋 ModalDeberModule V01.00 cargado', 'color:#667eea;font-weight:bold;font-size:11px');

})();
// MOD-009-012: FIN

</script>
